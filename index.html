<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121011">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Katana Dojo">
<title>Katana Dojo App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-sized app column, black brand band on top, role switcher above it for the demo */
:root {
  --bg: #efecea; --surface: #ffffff; --surface-2: #f6f3f2; --ink: #161314; --muted: #6d6567; --line: #e2dcdb;
  --band: #121011; --band-ink: #ffffff; --red: #c8102e; --red-ink: #ffffff; --red-soft: #fbe6e9; --red-text: #a10d25;
  --ok: #2e7d32; --ok-soft: #e5f2e6; --warn: #9a5600; --warn-soft: #fcefd9;
  --belt-orange: #f08a24; --belt-blue: #1f5fbf;
  --display: "Saira Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0a0a; --surface: #191617; --surface-2: #221e1f; --ink: #f3eeee; --muted: #a69d9f; --line: #2f2a2b;
  --band: #000000; --band-ink: #ffffff; --red: #e0283f; --red-ink: #ffffff; --red-soft: #3a141a; --red-text: #ff7a8a;
  --ok: #72c476; --ok-soft: #17301a; --warn: #f0a64c; --warn-soft: #3a2a12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b0a0a; --surface: #191617; --surface-2: #221e1f; --ink: #f3eeee; --muted: #a69d9f; --line: #2f2a2b;
  --band: #000000; --band-ink: #ffffff; --red: #e0283f; --red-ink: #ffffff; --red-soft: #3a141a; --red-text: #ff7a8a;
  --ok: #72c476; --ok-soft: #17301a; --warn: #f0a64c; --warn-soft: #3a2a12; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.demo { max-width: 420px; margin: 0 auto 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--body); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--band); color: var(--band-ink); }
.note { max-width: 420px; margin: 0 auto 10px; font-size: 12px; color: var(--muted); }
.phone { max-width: 420px; margin: 0 auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 26px; overflow: hidden; position: relative; display: flex; flex-direction: column; min-height: 720px; }
.band { background: var(--band); color: var(--band-ink); padding: 14px 18px 12px; display: flex; align-items: center; gap: 10px; }
.logo { width: 44px; height: 44px; border-radius: 50%; background: #fff; flex: none; display: block; }
.brand { font: 800 20px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.brand small { display: block; font: 600 11px var(--body); letter-spacing: .14em; opacity: .7; margin-top: 3px; }
.screen { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
h2 { font: 800 22px/1.1 var(--display); letter-spacing: .02em; margin: 0; text-wrap: balance; }
h3 { font: 600 13px var(--body); margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.big { font: 800 26px/1 var(--display); letter-spacing: .02em; }
.muted { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--red); border-radius: 4px; }
.belt { width: 64px; height: 14px; border-radius: 3px; position: relative; flex: none; }
.belt i { position: absolute; right: 10px; top: 0; width: 8px; height: 14px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border-radius: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--line); }
.tile.hot { background: var(--red-soft); border-color: transparent; color: var(--red-text); }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px var(--body); padding: 10px 14px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--red); color: var(--red-ink); border-color: var(--red); }
.btn.dark { background: var(--band); color: var(--band-ink); border-color: var(--band); }
.btn.sel-yes { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.btn.sel-no { background: var(--red-soft); color: var(--red-text); border-color: var(--red); }
.btn:focus-visible, .seg button:focus-visible, .nav button:focus-visible, .list button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.grow { flex: 1; }
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.medal { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 4px; display: grid; place-items: center; font: 800 15px var(--display); }
.medal.on { background: var(--band); color: var(--band-ink); box-shadow: inset 0 0 0 3px var(--red); }
.medal.off { background: var(--surface-2); color: var(--muted); border: 1px dashed var(--line); }
.badges span { font-size: 11px; color: var(--muted); display: block; }
.alert { background: var(--red); color: var(--red-ink); border-radius: 14px; padding: 12px 14px; font-weight: 500; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.no { background: var(--red-soft); color: var(--red-text); }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.grey { background: var(--surface-2); color: var(--muted); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list > * { display: flex; align-items: center; gap: 10px; padding: 11px 14px; width: 100%; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; }
.list > * + * { border-top: 1px solid var(--line); }
.list button { cursor: pointer; }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; font-size: 14px; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.check.ex { border-color: var(--warn); color: var(--warn); }
.nav { display: flex; border-top: 1px solid var(--line); background: var(--surface); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); }
.nav button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 500 11px var(--body); padding: 6px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.nav button[aria-current="true"] { color: var(--red-text); }
.nav svg { width: 22px; height: 22px; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; font-variant-numeric: tabular-nums; }
.dot.p { background: var(--ok-soft); color: var(--ok); } .dot.a { background: var(--red-soft); color: var(--red-text); } .dot.e { background: var(--warn-soft); color: var(--warn); }
input, textarea { width: 100%; font: 15px var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
textarea { min-height: 80px; resize: vertical; }
label.sw { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 76px; background: var(--band); color: var(--band-ink); padding: 12px 14px; border-radius: 12px; font-size: 14px; border-left: 4px solid var(--red); }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .25s ease-out; } @keyframes up { from { transform: translateY(8px); opacity: 0; } } }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 480px) {
  body { padding-left: 0; padding-right: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: 0; background: var(--band); }
  .demo { padding: 8px 12px; margin: 0; max-width: none; }
  .demo .seg { background: #2a2526; border-color: #2a2526; }
  .demo .seg button { color: #cfc7c8; }
  .demo .seg button[aria-pressed="true"] { background: var(--red); color: #fff; }
  .note { display: none; }
  .phone { border-radius: 0; border: 0; min-height: calc(100vh - 52px - env(safe-area-inset-top, 0px)); min-height: calc(100dvh - 52px - env(safe-area-inset-top, 0px)); }
}
</style>
</head>

    <button id="l-fr" data-lang="fr">FR</button>
    <button id="reset" data-act="reset" aria-label="Demo zurücksetzen">↺</button>
  </div>
</div>

  const c = S.kids[k].count, st = S.kids[k].streak;
  const list = [["10", c >= 10, "10 " + t("trainings")], ["25", c >= 25, `${Math.min(c, 25)}/25`], ["50", c >= 50, `${Math.min(c, 50)}/50`],
    ["4W", st >= 4, "4 " + t("streak")], ["8W", st >= 8, `${st}/8`], ["100", c >= 100, `${c}/100`], ["1st", k === "luca", "Turnier"], ["K", false, "Kata"]];
  return `<div class="badges">${list.slice(0, all ? 8 : 4).map(([m, on, l]) => `<div><div class="medal ${on ? "on" : "off"}">${m}</div><span>${l}</span></div>`).join("")}</div>`;
}
function calendar() {
  return `<h2>${t("cal")}</h2><div class="list">${S.sessions.map((s) => `<div><div class="grow"><div style="font-weight:600">${s.d[S.lang]} · ${s.time}</div><div class="muted">Kids · ${s.place}</div></div>
    ${s.status === "cancelled" ? `<span class="pill no">${t("cancelled")}</span>` : s.done ? `<span class="pill grey">✓</span>` : ""}</div>`).join("")}</div>`;
}
function newsList() {
  return `<h2>${t("news")}</h2>${S.news.map((n) => `<div class="card"><div class="muted">${n.d}</div><div style="font-weight:600;margin:2px 0 4px">${esc(n.t)}</div><div>${esc(n.b)}</div></div>`).join("")}`;
}
function payLine(k) {
  const p = S.kids[k].pay;
  return p.status === "paid" ? `<span class="pill ok">${t("paidUntil")} ${p.until}</span>` : `<span class="pill warn">${t("openPay")}: CHF ${p.amount} · ${t("due")} ${p.due}</span>`;
}

const R = {
  kid: {
    start: () => `${cancelAlert()}<h2>${t("hello")}, Luca</h2>${progress("luca")}
      <div class="tiles"><div class="tile hot"><div class="big num">${S.kids.luca.streak}</div><div style="font-size:12px">${t("streak")}</div></div>
      <div class="tile"><div class="big num">${S.groupGoal} / 200</div><div class="muted" style="font-size:12px">${t("goal")}</div></div></div>
      ${rsvpCard("luca")}<div class="card"><h3 style="margin-bottom:10px">${t("badges")}</h3>${badgesGrid("luca")}</div>`,
    cal: calendar,
    awards: () => `<h2>${t("awards")}</h2><div class="card">${badgesGrid("luca", true)}</div>
      <div class="card"><h3>${t("trophies")}</h3><div class="row" style="margin-top:8px"><div class="medal on" style="margin:0">2</div><div>${t("trophy1")}<div class="muted">05.10.2026</div></div></div></div>
      <div class="card"><h3>${t("beltHistory")}</h3><div class="list" style="margin-top:8px"><div>${belt("luca")}<span class="grow">9. Kyu</span><span class="muted">14.06.2026</span></div>
      <div><div class="belt" style="background:#f08a24"></div><span class="grow">10. Kyu</span><span class="muted">10.12.2025</span></div></div></div>`,
    profile: profileScreen
  },
  parent: {
    start: () => S.view ? childDetail(S.view) : `${cancelAlert()}<h2>${t("hello")}</h2>
      ${["luca", "emma"].map((k) => { const kid = S.kids[k]; return `<button class="card" data-child="${k}" style="text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;font:inherit;color:inherit">
        <div class="row between" style="width:100%"><div class="row">${belt(k)}<b>${kid.name}</b></div><span class="muted">${kid.kyu}. Kyu</span></div>
        <div class="bar" style="width:100%"><i style="width:${kid.count / kid.need * 100}%"></i></div>
        <div class="muted">${t("still", { n: kid.need - kid.count })}</div>${payLine(k)}</button>`; }).join("")}
      ${rsvpCard("luca", "Luca")}${rsvpCard("emma", "Emma")}`,
    cal: calendar, news: newsList, profile: profileScreen
  },
  coach: {
    today: () => S.view === "att" ? attScreen() : coachToday(),
    cal: calendar,
    members: () => `<h2>${t("members")}</h2><div class="list">${S.roster.map((r) => {
      const k = S.kids[r.id]; const owes = k && k.pay.status === "open";
      return `<div><div class="grow"><div style="font-weight:600">${r.name}</div><div class="muted">${r.kyu}. Kyu · Kids</div></div>
      ${owes ? `<button class="btn" data-pay="${r.id}" style="padding:6px 10px;font-size:13px">${t("receive")} CHF ${k.pay.amount}</button>` : k ? `<span class="pill ok">✓</span>` : ""}</div>`; }).join("")}</div>`,
    news: () => `<h2>${t("news")}</h2><div class="card" style="display:flex;flex-direction:column;gap:10px">
      <input id="n-title" placeholder="${t("title")}" value="Training im Dojo Lyss"><textarea id="n-body" placeholder="${t("text")}">Am 29.10. trainieren wir ausnahmsweise im Dojo Lyss. Treffpunkt 17:45.</textarea>
      <div class="row between"><label class="sw"><input id="n-push" type="checkbox" checked style="width:auto"> ${t("sendPush")}</label><span class="muted">${t("allKids")}</span></div>
      <button class="btn primary" data-act="publish">${t("publish")}</button></div>${newsList().replace(/<h2>.*?<\/h2>/, "")}`
  }
};

function coachToday() {
  const s = nextSession();
  if (!s) return `<h2>${t("today")}</h2><div class="card muted">${t("noNext")}</div>`;
  const y = S.roster.filter((r) => r.rsvp === "yes").length, n = S.roster.filter((r) => r.rsvp === "no").length, o = S.roster.length - y - n;
  return `${S.cancelNotice ? `<div class="card muted">${t("cancelledMsg", { d: S.cancelNotice[S.lang] })}</div>` : ""}<h2>${t("today")}</h2>
    <div class="card" style="display:flex;flex-direction:column;gap:12px"><div><div class="big">Kids · ${s.d[S.lang]}</div><div class="muted">${s.time} · ${s.place}</div></div>
    <div class="row" style="flex-wrap:wrap;gap:6px"><span class="pill ok">${y} ${t("yes")}</span><span class="pill no">${n} ${t("no")}</span><span class="pill grey">${o} ${t("open")}</span></div>
    <button class="btn dark" data-act="att">${t("attendance")}</button><button class="btn" data-act="cancel" style="color:var(--red-text)">${t("cancelBtn")}</button></div>
    <div class="card"><h3>${t("goal")}</h3><div class="big num" style="margin:6px 0">${S.groupGoal} / 200</div><div class="bar"><i style="width:${S.groupGoal / 2}%"></i></div></div>`;
}
function attScreen() {
  const s = nextSession();
  S.roster.forEach((r) => { if (r.here === false && r.init !== s.id) { r.here = r.rsvp === "yes"; r.init = s.id; } });
  const c = S.roster.filter((r) => r.here).length;
  return `<button class="btn" data-act="back" style="align-self:flex-start">← ${t("back")}</button><h2>Kids · ${s.d[S.lang]}</h2>
    <div class="muted">${t("present")}: <b class="num">${c}</b> / ${S.roster.length} · ${t("tap")}</div>
    <div class="list">${S.roster.map((r) => `<button data-here="${r.id}"><span class="check ${r.here ? "on" : r.rsvp === "no" ? "ex" : ""}">${r.here ? "✓" : r.rsvp === "no" ? "–" : ""}</span>
      <span class="grow"><b style="font-weight:500">${r.name}</b><br><span class="muted">${r.kyu}. Kyu</span></span>
      <span class="pill ${r.rsvp === "yes" ? "ok" : r.rsvp === "no" ? "no" : "grey"}">${r.rsvp === "yes" ? t("willCome") : r.rsvp === "no" ? t("wontCome") : t("noAnswer")}</span></button>`).join("")}</div>
    <button class="btn">＋ ${t("trial")}</button><button class="btn primary" data-act="save">${t("save")}</button>`;
}
function childDetail(k) {
  const kid = S.kids[k], p = kid.pay, a = kid.att.filter((x) => x === "p").length;
  return `<button class="btn" data-act="back" style="align-self:flex-start">← ${t("back")}</button><h2>${kid.name}</h2>${progress(k)}
    <div class="card"><h3>${t("attendance")}</h3><div style="margin:8px 0">${t("month", { a, b: kid.att.length })}</div>
      <div class="dots">${kid.att.map((x, i) => `<div class="dot ${x}" title="${x}">${[1, 6, 8, 13, 15, 20, 22, 27][i]}</div>`).join("")}</div></div>
    <div class="card"><h3>${t("badges")}</h3><div style="margin-top:10px">${badgesGrid(k)}</div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>${t("payments")}</h3>${payLine(k)}
      ${p.receipt ? `<div class="muted">${t("cash")} CHF ${p.receipt} · 16.10. · Sensei</div>` : ""}
      ${k === "emma" ? `<div class="muted">${t("familyDisc")}: CHF 20</div>` : `<div class="muted">${t("cash")} CHF 120 · 01.10. · Sensei</div>`}</div>`;
}
function profileScreen() {
  const parent = S.role === "parent";
  return `<h2>${t("profile")}</h2><div class="list"><div><span class="grow">${t("lang")}</span><span class="pill grey">${S.lang.toUpperCase()}</span></div>
    <div><span class="grow">${t("notif")}</span><span class="pill ok">✓</span></div></div>
    ${parent ? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>${t("consent")} · Luca</h3><span class="pill ok" style="align-self:flex-start">${t("consentOk")}</span>
      <h3>${t("childLogin")}</h3><button class="btn" data-act="qr">${t("newQr")}</button></div>` : ""}`;
}

function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => (el.hidden = true), 2600);
}
function render() {
  document.querySelectorAll("[data-role]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.role === S.role));
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === S.lang));
  document.documentElement.lang = S.lang;
  $("#note").textContent = t("note");
  const tabs = TABS[S.role];
  if (!tabs.includes(S.tab)) S.tab = tabs[0];
  $("#screen").innerHTML = R[S.role][S.tab]();
  persist();
  $("#nav").innerHTML = tabs.map((k) => `<button data-tab="${k}" aria-current="${k === S.tab}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>${t(k)}</button>`).join("");
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.role) { S.role = d.role; S.tab = TABS[S.role][0]; S.view = null; }
  else if (d.lang) S.lang = d.lang;
  else if (d.tab) { S.tab = d.tab; S.view = null; }
  else if (d.rsvp) { const [id, a] = d.rsvp.split(":"); const r = S.roster.find((x) => x.id === id); r.rsvp = r.rsvp === a ? null : a; }
  else if (d.child) S.view = d.child;
  else if (d.here) { const r = S.roster.find((x) => x.id === d.here); r.here = !r.here; }
  else if (d.pay) { const p = S.kids[d.pay].pay; p.receipt = p.amount; p.status = "paid"; p.until = "31.12.2026"; toast(`${t("cash")} CHF ${p.amount}`); }
  else if (d.act === "att") S.view = "att";
  else if (d.act === "back") S.view = null;
  else if (d.act === "qr") toast(t("qrDone"));
  else if (d.act === "reset") { try { localStorage.removeItem(KEY); } catch (err) {} location.reload(); return; }
  else if (d.act === "save") {
    const s = nextSession(); const present = S.roster.filter((r) => r.here);
    present.forEach((r) => { if (S.kids[r.id]) { S.kids[r.id].count++; S.kids[r.id].att.push("p"); } });
    S.roster.forEach((r) => { r.here = false; r.rsvp = null; r.init = null; });
    S.groupGoal += present.length; s.done = true; S.view = null; toast(t("saved"));
  }
  else if (d.act === "cancel") {
    const s = nextSession(); s.status = "cancelled"; S.cancelNotice = s.d;
    S.roster.forEach((r) => { r.rsvp = null; r.here = false; r.init = null; });
    toast(t("push", { n: S.roster.length * 2 }));
  }
  else if (d.act === "publish") {
    const title = $("#n-title").value.trim(), body = $("#n-body").value.trim();
    if (!title) { $("#n-title").focus(); return; }
    S.news.unshift({ t: title, b: body, d: "16.10." });
    toast($("#n-push").checked ? t("push", { n: 16 }) : t("published"));
  }
  else return;
  render();
});
render();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
